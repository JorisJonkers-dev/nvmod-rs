[package]
name = "nvmod-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Runs the game and tools through an Instance's staged view: the executables registry, the Instance lock and the launch plan."

[dependencies]
nvmod-core = { workspace = true }
nvmod-formats = { workspace = true }
nvmod-instance = { workspace = true }
nvmod-runner = { workspace = true }
nvmod-stage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# kill(pid, 0) to tell whether a lock holder still runs, off Linux (already in the tree through ctrlc).
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }

[dev-dependencies]
nvmod-testkit = { workspace = true }

[lints]
workspace = true
