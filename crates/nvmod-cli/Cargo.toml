[package]
name = "nvmod-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Command line of nvmod."

[lib]
name = "nvmod_cli"
path = "src/lib.rs"

[[bin]]
name = "nvmod"
path = "src/main.rs"

[dependencies]
nvmod-core = { workspace = true }
nvmod-catalog = { workspace = true }
nvmod-doctor = { workspace = true }
nvmod-formats = { workspace = true }
nvmod-instance = { workspace = true }
nvmod-stage = { workspace = true }
nvmod-import = { workspace = true }
nvmod-install = { workspace = true }
nvmod-modinstall = { workspace = true }
nvmod-loadorder = { workspace = true }
nvmod-tools = { workspace = true }
loot-rs = { workspace = true }
nvmod-pe = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ctrlc = { version = "3.5.2", features = ["termination"] }

[dev-dependencies]
nvmod-testkit = { workspace = true }

[lints]
workspace = true
