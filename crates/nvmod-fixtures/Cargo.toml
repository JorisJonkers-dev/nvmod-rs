[package]
name = "nvmod-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Writes the synthetic fixtures of a full nvmod setup run to a folder, for the cross-repo end-to-end test in nv-linux."

[lib]
name = "nvmod_fixtures"
path = "src/lib.rs"

[[bin]]
name = "nvmod-fixtures"
path = "src/main.rs"

[dependencies]
nvmod-testkit = { workspace = true }
nvmod-tools = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
