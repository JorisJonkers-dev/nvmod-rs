[package]
name = "nvmod-gui-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The nvmod GUI painted with GPUI: the only crate allowed to depend on gpui."

[lib]
name = "nvmod_gui_gpui"
path = "src/lib.rs"

[[bin]]
name = "nvmod-gui"
path = "src/main.rs"

[dependencies]
nvmod-gui-shell = { workspace = true }
nvmod-ui-service = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-kit = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
