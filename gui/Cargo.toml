# The GUI workspace (ADR-0004 of nv-linux). Its own workspace root with its own Cargo.lock, like fuzz/: nothing in
# here enters the main workspace's lock file, `cargo deny` run or coverage gate. The toolkit-free crates
# nvmod-ui-model and nvmod-ui-service stay in the main workspace and are used from here by path.
[workspace]
resolver = "3"
members = ["crates/nvmod-gui-shell", "crates/nvmod-gui-gpui", "crates/nvmod-gui-egui"]

[workspace.package]
# The GUI ships under nvmod's version (one product, one tag); it is not released yet, so this stays 0.0.0.
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/JorisJonkers-dev/nvmod-rs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
nvmod-ui-model = { path = "../crates/nvmod-ui-model" }
nvmod-ui-service = { path = "../crates/nvmod-ui-service" }
nvmod-gui-shell = { path = "crates/nvmod-gui-shell" }
serde_json = "1"

# GPUI comes from the weekly gpui-pre snapshots of Zed (one maintainer). Every gpui-pre* crate must be at the same
# exact version, bumped together monthly in one commit (README.md of this folder; scripts/check-gui-pins.sh).
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland", "x11"] }
gpui-kit = { version = "=0.9.0", default-features = false }

# The canary toolkit: a tiny window from the same view-model, so a swap stays possible.
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }

[profile.release]
opt-level = 3
