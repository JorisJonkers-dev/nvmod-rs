# cargo-deny configuration of the GUI workspace (ADR-0004 of nv-linux). Run from the repository root:
#   cargo deny --locked --manifest-path gui/Cargo.toml check --config gui/deny.toml
# The main workspace's deny.toml never sees GPUI. The GUI is GPL-3.0-only; every licence below is compatible with
# it, and a licence not listed is refused. The list is the one the GPUI spike found in its lock files (a metadata
# scan, not a legal review): where a crate offers a choice, the permissive option is the one taken.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Add RUSTSEC ids here only with a comment saying why the advisory does not apply.
ignore = []
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0", # file-level copyleft, fine for linking (three crates in the spike)
    "OFL-1.1", # fonts bundled by egui
    "Ubuntu-font-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow" # a GPUI tree carries many; the exact pins are checked by scripts/check-gui-pins.sh
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
