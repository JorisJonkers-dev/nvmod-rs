# Tooling for the checks in Taskfile.yml. `mise install` is the only setup step.
# The Rust toolchain is not listed: rust-toolchain.toml pins it (and the llvm-tools component for coverage).
[tools]
task = "3.54.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
python = "3.15.2"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
