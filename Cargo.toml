[workspace]
resolver = "3"
members = ["crates/nvmod-core", "crates/nvmod-cli", "crates/nvmod-pe", "crates/nvmod-testkit", "crates/nvmod-formats", "crates/nvmod-catalog", "crates/nvmod-doctor", "crates/nvmod-instance"]
# fuzz/ is its own workspace (libfuzzer-sys stays out of the shipped crates).
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/JorisJonkers-dev/nvmod-rs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
nvmod-core = { path = "crates/nvmod-core" }
nvmod-catalog = { path = "crates/nvmod-catalog" }
nvmod-doctor = { path = "crates/nvmod-doctor" }
nvmod-instance = { path = "crates/nvmod-instance" }
nvmod-formats = { path = "crates/nvmod-formats" }
nvmod-pe = { path = "crates/nvmod-pe" }
nvmod-testkit = { path = "crates/nvmod-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
