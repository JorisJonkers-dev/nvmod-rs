[workspace]
resolver = "3"
members = ["crates/nvmod-core", "crates/nvmod-cli", "crates/nvmod-pe", "crates/nvmod-testkit", "crates/nvmod-formats", "crates/nvmod-catalog", "crates/nvmod-doctor", "crates/nvmod-instance", "crates/nvmod-stage", "crates/nvmod-import", "crates/nvmod-install", "crates/nvmod-modinstall", "crates/nvmod-loadorder", "crates/nvmod-tools", "crates/nvmod-fixtures", "crates/nvmod-ui-model"]
# fuzz/ is its own workspace (libfuzzer-sys stays out of the shipped crates).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/JorisJonkers-dev/nvmod-rs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
nvmod-core = { path = "crates/nvmod-core" }
nvmod-catalog = { path = "crates/nvmod-catalog" }
nvmod-doctor = { path = "crates/nvmod-doctor" }
nvmod-instance = { path = "crates/nvmod-instance" }
nvmod-stage = { path = "crates/nvmod-stage" }
nvmod-tools = { path = "crates/nvmod-tools" }
nvmod-loadorder = { path = "crates/nvmod-loadorder" }
# Linked as a library and pinned to a release tag (ADR-0003, docs/architecture/integration.md of nv-linux).
loot-rs = { git = "https://github.com/JorisJonkers-dev/loot-rs", tag = "v0.1.0" }
nvmod-import = { path = "crates/nvmod-import" }
nvmod-install = { path = "crates/nvmod-install" }
nvmod-modinstall = { path = "crates/nvmod-modinstall" }
nvmod-formats = { path = "crates/nvmod-formats" }
nvmod-pe = { path = "crates/nvmod-pe" }
nvmod-testkit = { path = "crates/nvmod-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
