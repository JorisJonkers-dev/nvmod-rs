# `task check` is what the Pipeline Complete job runs, so local and CI cannot drift.
version: "3"

vars:
  COVERAGE_MIN: "80"

tasks:
  default:
    cmd: task --list
    silent: true

  fmt:
    desc: Check formatting
    cmd: cargo fmt --all -- --check

  clippy:
    desc: Clippy with warnings denied
    cmds:
      # Product code first, with the ADR-0005 rule (no std::process::Command outside nvmod-runner) in force ...
      - cargo clippy --locked --workspace -- -D warnings
      # ... then tests and examples, which start the built binary and so are exempt from that one lint.
      - cargo clippy --locked --workspace --all-targets -- -D warnings -A clippy::disallowed-methods

  test:
    desc: Tests and the line-coverage gate ({{.COVERAGE_MIN}}%)
    cmd: cargo llvm-cov --locked --workspace --fail-under-lines {{.COVERAGE_MIN}}

  fuzz:check:
    desc: The fuzz harnesses compile (stable, type-check only; running them needs nightly and cargo-fuzz)
    cmd: cargo check --locked --manifest-path fuzz/Cargo.toml

  deny:
    desc: Licences, bans, sources and advisories (deny.toml), for the workspace and the fuzz workspace
    cmds:
      - cargo deny --locked check
      - cargo deny --locked --manifest-path fuzz/Cargo.toml check

  audit:
    desc: RustSec advisories with cargo audit, for the workspace and the fuzz workspace
    cmds:
      - cargo audit
      - cargo audit --file fuzz/Cargo.lock

  msrv:
    desc: rust-version of every crate equals the toolchain of rust-toolchain.toml, so the pinned build is the MSRV build
    cmd: |
      declared="$(cargo metadata --format-version 1 --no-deps | jq -r '[.packages[].rust_version] | unique | join(",")')"
      pinned="$(sed -n 's/^channel = "\([0-9]*\.[0-9]*\)\.[0-9]*"/\1/p' rust-toolchain.toml)"
      echo "rust-version: $declared, rust-toolchain.toml: $pinned"
      test "$declared" = "$pinned"

  secrets:
    desc: Scan every commit for secrets
    cmd: gitleaks git --redact --no-banner --config .gitleaks.toml .

  lint:actions:
    desc: actionlint and zizmor on every workflow
    cmds:
      - actionlint
      - zizmor --offline --no-progress .github/workflows/

  guards:
    desc: Repository guards on the whole tree (SPDX headers, no game data or binaries, .gitignore, release handling of every crate)
    cmd: python3 -I scripts/repo_guards.py all

  scripts:
    desc: Self-tests of the repository's own scripts (throwaway git repositories, no network)
    cmd: python3 -I -m unittest discover -s scripts -p 'test_*.py' -t scripts

  check:
    desc: Everything the pipeline runs on a pull request
    cmds:
      - task: fmt
      - task: clippy
      - task: test
      - task: fuzz:check
      - task: deny
      - task: audit
      - task: msrv
      - task: secrets
      - task: lint:actions
      - task: guards
      - task: scripts
