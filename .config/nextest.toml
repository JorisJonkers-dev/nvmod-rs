# cargo-nextest settings. CI runs the tests with `--profile ci` on Linux, Windows and macOS and hands the JUnit
# files to the feature-catalogue reports (tally ingest; docs/TESTING.md, "Feature catalogue"). A test counts as
# passed only when it ran once and passed: no retries, so no flaky pass, and every skipped test is listed.

[profile.ci]
retries = 0
fail-fast = false
flaky-result = "fail"

[profile.ci.junit]
path = "junit.xml"
report-skipped = "all"

# A time-bounded test (10 seconds in a debug build) must not compete with the other test processes for the CPU: nextest
# runs one process per test, all at once, where `cargo test` ran the test binaries one after the other.
[[profile.ci.overrides]]
filter = "test(three_hundred_mods_over_fifty_thousand_paths_are_fast)"
threads-required = "num-cpus"
