# NVSE plugin catalogue: data this repository owns. Every entry carries its provenance.
#
# Fields of [[plugin]]: id (stable), role (framework: other mods need it; the update checklist says so for
# JIP LN, JohnnyGuitar and ShowOff), name (the mod's folder name in the owner's instance), dll (the file in
# NVSE/Plugins, compared without case), ini (files next to it that the plugin reads), nexus_mod_id (only where a
# document says so), requires / conflicts (plugin ids), replaced_by (plugin id), provided_by.vanilla and provided_by.nv-rs (see below), game_version and min_xnvse (the game executable version the plugin requires and
# the lowest xNVSE it needs, `a.b.c.d`; left out where nobody has recorded them: the Doctor then says unknown), and [plugin.provenance] with source, verified_on, verified, note.
#
# provided_by.<target> says what provides the entry on that target: `external` (a DLL the user installs; the
# default, and on nv-rs it means nobody has recorded that nv-rs loads it, so the Doctor says unknown), `builtin-full`
# or `builtin-partial` (built into nv-rs; needs `extender`, the id in the installed nv-rs's capabilities.json) or
# `absent` (a DLL of it cannot load on that target). No coverage number is ever written here: the Doctor reads
# implemented and total counts from capabilities.json at run time. role = "extender" marks the script extender
# itself, whose DLL sits in the game folder and is required on the vanilla target.
#
# `verified = true` means the file names were seen in a real instance. Nothing else is claimed: minimum xNVSE,
# requirements and conflicts are empty until someone checks them, and provided_by is left at its default
# (`external`) wherever nobody has recorded that nv-rs builds the plugin in. [[mod]] records a Nexus id for a mod folder name, for the meta.ini mismatch check.
schema = 1

[[plugin]]
id = "xnvse"
role = "extender"
name = "xNVSE"
dll = "nvse_1_4.dll"

[plugin.provided_by.nv-rs]
kind = "builtin-partial"
extender = "xnvse"

[plugin.provenance]
source = "docs/research/nv-rs-builtin-extenders.md and docs/architecture/integration.md (nv-linux): nv-rs builds xNVSE in; extender ids are those of nv-rs's capabilities.json (JorisJonkers-dev/nv-rs, .fork/schemas)"
verified_on = "2026-11-14"
verified = false
note = "the kind says built in with a coverage read at run time; no count is recorded here"

