# Builds the nvmod CLI for a release tag and attaches it to the GitHub release (ADR-0009, ADR-0010):
#   nvmod-<v>-x86_64-linux.tar.zst   built on an old glibc baseline (ubuntu-22.04)
#   nvmod-<v>-x86_64-windows.zip     portable layout with the nvmod.portable marker
#   nvmod-<v>-universal-macos.tar.zst one binary for Apple silicon and Intel Macs (lipo), built on macos-latest
#   SHA256SUMS, nvmod-<v>.cdx.json (CycloneDX SBOM), release-index.json
# plus one GitHub artifact attestation over all of them, made by this workflow. Tools are never bundled.
#
# release.yml dispatches this workflow when release-please creates a release (a tag made with the default token starts
# no other workflow), with publish true. A manual dispatch on an existing tag is the dry run: it builds and attests,
# and uploads to the release only when `publish` is true, which the publish job allows for release-please tags only.
# Verify an asset with docs/releasing.md.
name: Release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, vX.Y.Z
        required: true
        type: string
      publish:
        description: Upload the assets to the release (false is a dry run)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # The macOS command, one processor per runner in parallel (x86_64 cross-compiled on Apple silicon); the macOS entry of
  # `build` joins the two halves with lipo. Uncached, as every release build here.
  macos-half:
    name: Build nvmod for ${{ matrix.rust-target }}
    strategy:
      fail-fast: true
      matrix:
        rust-target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          persist-credentials: false
      - name: Build nvmod
        working-directory: src
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          set -euo pipefail
          rustup target add "$RUST_TARGET"
          cargo build --release --locked -p nvmod-cli --target "$RUST_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nvmod-macos-${{ matrix.rust-target }}
          path: src/target/${{ matrix.rust-target }}/release/nvmod
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build ${{ matrix.target }}
    needs: macos-half
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: x86_64
            os: ubuntu-22.04
            exe: nvmod
          - target: windows
            arch: x86_64
            os: windows-2022
            exe: nvmod.exe
          - target: macos
            arch: universal
            os: macos-latest
            exe: nvmod
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      # The tag's source goes to src/; the packaging scripts come from the workflow's own ref in tooling/, so a tag that
      # predates them still builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          persist-credentials: false

      - name: The tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src/Cargo.toml | head -n1)"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z"; exit 1; }
          [ "v$version" = "$TAG" ] || { echo "Cargo.toml is $version, the tag is $TAG"; exit 1; }
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ matrix.target == 'macos' }}
        with:
          pattern: nvmod-macos-*
          path: ${{ runner.temp }}/halves

      # rust-toolchain.toml pins the compiler; rustup installs it on first use. On macOS the two halves of macos-half are
      # joined into one binary at the path the other targets use.
      - name: Build nvmod
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          if [ "$TARGET" = macos ]; then
            mkdir -p target/release
            lipo -create -output target/release/nvmod \
              "$RUNNER_TEMP/halves/nvmod-macos-aarch64-apple-darwin/nvmod" "$RUNNER_TEMP/halves/nvmod-macos-x86_64-apple-darwin/nvmod"
            chmod 0755 target/release/nvmod
            lipo -archs target/release/nvmod | tee "$RUNNER_TEMP/archs"
            grep -qw arm64 "$RUNNER_TEMP/archs" && grep -qw x86_64 "$RUNNER_TEMP/archs"
          else
            cargo build --release --locked -p nvmod-cli
          fi

      - name: Third-party notices
        shell: bash
        run: |
          set -euo pipefail
          (cd src && cargo metadata --locked --format-version 1) >"$RUNNER_TEMP/metadata.json"
          python3 -I tooling/scripts/package_release.py notices --metadata "$RUNNER_TEMP/metadata.json" --out "$RUNNER_TEMP/notices.txt"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tooling/scripts/package_release.py package --target "$TARGET" --version "$VERSION" \
            --binary "src/target/release/${{ matrix.exe }}" --notices "$RUNNER_TEMP/notices.txt" --out dist

      # Run the packaged program from a folder of its own, as a user does.
      - name: Smoke test the archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/smoke"
          folder="nvmod-$VERSION-$ARCH-$TARGET"
          if [ "$TARGET" = windows ]; then
            powershell -NoProfile -Command "Expand-Archive -Path dist/$folder.zip -DestinationPath '$RUNNER_TEMP/smoke'"
            ls "$RUNNER_TEMP/smoke/$folder/nvmod.portable"
          else
            zstd -dc "dist/$folder.tar.zst" | tar -x -C "$RUNNER_TEMP/smoke"
          fi
          "$RUNNER_TEMP/smoke/$folder/${{ matrix.exe }}" --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: SBOM
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The tag's source goes to src/; the packaging scripts come from the workflow's own ref in tooling/, so a tag that
      # predates them still builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          persist-credentials: false
      - name: CycloneDX SBOM of the nvmod binary
        working-directory: src
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP" && cargo install cargo-cyclonedx --locked --version 0.5.10)
          cargo cyclonedx --manifest-path crates/nvmod-cli/Cargo.toml --format json --spec-version 1.5 \
            --override-filename sbom
          mkdir ../dist
          mv crates/nvmod-cli/sbom.json "../dist/nvmod-${TAG#v}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-sbom
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Checksums, index, attestation
    needs: [build, sbom]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # upload the assets and add the licence section to the release notes
      id-token: write # the attestation is signed with the workflow's OIDC identity
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Publishing is for release-please tags only
        if: ${{ env.PUBLISH == 'true' }}
        working-directory: src
        run: |
          set -euo pipefail
          # The tag must be a release-please release: vX.Y.Z on main, on the commit of a merged release pull request.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG" refs/remotes/origin/main || { echo "$TAG is not on main"; exit 1; }
          subject="$(git log -1 --format=%s "refs/tags/$TAG")"
          [[ "$subject" =~ ^chore\(main\):\ release\ ${TAG#v}\  ]] || { echo "$TAG is not a release-please commit: $subject"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS and release-index.json
        run: |
          set -euo pipefail
          # The index is built from the archives; SHA256SUMS then covers the archives, the SBOM and the index.
          python3 -I tooling/scripts/package_release.py index --dir dist --tag "$TAG" --repo "$REPO" \
            --date "$(date -u +%F)" --out "$RUNNER_TEMP/release-index.json"
          mv "$RUNNER_TEMP/release-index.json" dist/release-index.json
          python3 -I tooling/scripts/package_release.py sums --dir dist --out "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          ls -l dist
          cat dist/SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to the release
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          notes="$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)"
          if ! grep -q '<!-- release-assets -->' <<<"$notes"; then
            {
              printf '%s\n\n' "$notes"
              cat <<NOTES
          <!-- release-assets -->
          ## Licence and source

          nvmod is GPL-3.0-only (the LICENSE file in each archive). Source of this release: https://github.com/${REPO}/tree/${TAG}

          The binaries are not code-signed yet, so Windows SmartScreen may warn on first run. Verify a download with SHA256SUMS or gh attestation verify; see docs/releasing.md.
          NOTES
            } >"$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ env.PUBLISH != 'true' }}
        with:
          name: release-assets-dry-run
          path: dist/
          retention-days: 7

  # The archives of the release as OCI packages on ghcr.io, as the Toolbox's packages ADR decides:
  # ghcr.io/jorisjonkers-dev/nvmod-rs:<version>-<target>. Only for a published release, never for a dry run.
  # Both archives are checked before anything is pushed. Each pushed digest is attested in the registry; the job then
  # pulls every digest anonymously and compares its SHA-256, so a package that is not public fails the release.
  # The repository variable NVMOD_FIRST_PACKAGE_PUSH=true skips only that pull, for the first push of a new package
  # (ghcr.io creates it private; make it public, then remove the variable).
  packages:
    name: OCI packages
    needs: publish
    if: ${{ inputs.publish }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write # add the package references to the release notes
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      OUT: packages
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-{linux,windows}
          merge-multiple: true
          path: dist
      - name: Install oras
        # The repository allows only listed actions, so oras comes from its release, checked by SHA-256.
        env:
          ORAS_VERSION: 1.4.0
          ORAS_SHA256: d8e1dce2fd8ce996f1d901845b688eb0cf505a6082897606f053825bb47935d1
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/oras.tar.gz" "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  $RUNNER_TEMP/oras.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oras"
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"
      - name: Check the archives
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p "$OUT"
          cp "dist/nvmod-$VERSION-x86_64-linux.tar.zst" "dist/nvmod-$VERSION-x86_64-windows.zip" "$OUT/"
          zstd -t "$OUT/nvmod-$VERSION-x86_64-linux.tar.zst"
          unzip -t "$OUT/nvmod-$VERSION-x86_64-windows.zip" >/dev/null
          ls -l "$OUT"
      - name: Push packages
        id: push
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          push_one() {
            local target="$1" archive="$2"
            local ref="ghcr.io/jorisjonkers-dev/nvmod-rs:${VERSION}-x86_64-${target}"
            (cd "$OUT" && oras push "$ref" "$(basename "$archive")" \
              --annotation "org.opencontainers.image.source=https://github.com/${REPO}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "org.opencontainers.image.licenses=GPL-3.0-only")
            oras resolve "$ref" | tr -d '\n' >"$OUT/${target}.digest"
            sha256sum "$archive" | awk '{print $1}' >"$OUT/${target}.sha256"
            echo "pushed $ref $(cat "$OUT/${target}.digest")"
          }
          push_one linux "$OUT/nvmod-$VERSION-x86_64-linux.tar.zst"
          push_one windows "$OUT/nvmod-$VERSION-x86_64-windows.zip"
          {
            echo "digest_linux=$(cat "$OUT/linux.digest")"
            echo "digest_windows=$(cat "$OUT/windows.digest")"
          } >>"$GITHUB_OUTPUT"
      - name: Attest the Linux package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jorisjonkers-dev/nvmod-rs
          subject-digest: ${{ steps.push.outputs.digest_linux }}
          push-to-registry: true
      - name: Attest the Windows package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jorisjonkers-dev/nvmod-rs
          subject-digest: ${{ steps.push.outputs.digest_windows }}
          push-to-registry: true
      # The attestations above are pushed with the login of the push step; the pull below is anonymous.
      - name: Log out of the registry
        run: oras logout ghcr.io
      - name: Verify the packages are public
        if: ${{ vars.NVMOD_FIRST_PACKAGE_PUSH != 'true' }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          check() {
            local target="$1" archive="$2"
            local digest sha pulled
            digest="$(cat "$OUT/${target}.digest")"
            sha="$(cat "$OUT/${target}.sha256")"
            rm -rf "$OUT/pull-${target}"
            mkdir -p "$OUT/pull-${target}"
            oras pull "ghcr.io/jorisjonkers-dev/nvmod-rs@${digest}" -o "$OUT/pull-${target}"
            pulled="$(sha256sum "$OUT/pull-${target}/$(basename "$archive")" | awk '{print $1}')"
            echo "$target: pulled $pulled (expected $sha)"
            test "$pulled" = "$sha"
          }
          check linux "nvmod-$VERSION-x86_64-linux.tar.zst"
          check windows "nvmod-$VERSION-x86_64-windows.zip"
      - name: Record the package references
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          summary="$(mktemp)"
          {
            echo "## OCI packages"
            echo
            echo "| Name | Tag | Digest | Archive SHA-256 |"
            echo "| --- | --- | --- | --- |"
            for target in linux windows; do
              echo "| ghcr.io/jorisjonkers-dev/nvmod-rs | ${VERSION}-x86_64-${target} | $(cat "$OUT/${target}.digest") | $(cat "$OUT/${target}.sha256") |"
            done
          } >"$summary"
          cat "$summary" >>"$GITHUB_STEP_SUMMARY"
          notes="$(mktemp)"
          { gh release view "$TAG" --repo "$REPO" --json body --jq .body; printf '\n'; cat "$summary"; } >"$notes"
          gh release edit "$TAG" --repo "$REPO" --notes-file "$notes"

  # The Toolbox's component-bump.yml opens the pull request that moves its nvmod pin to the new tag
  # (rauls-trusty-toolbox#17). Only for a published release, never for a dry run.
  toolbox:
    name: Tell the Toolbox
    needs: publish
    if: ${{ inputs.publish }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rauls-trusty-toolbox
          permission-contents: write
      - name: component-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api repos/JorisJonkers-dev/rauls-trusty-toolbox/dispatches \
            -f event_type=component-release -f 'client_payload[component]=nvmod' -f "client_payload[tag]=$TAG"
