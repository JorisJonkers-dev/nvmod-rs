# Builds the nvmod CLI for a release tag and attaches it to the GitHub release (ADR-0009, ADR-0010):
#   nvmod-<v>-x86_64-linux.tar.zst   built on an old glibc baseline (ubuntu-22.04)
#   nvmod-<v>-x86_64-windows.zip     portable layout with the nvmod.portable marker
#   SHA256SUMS, nvmod-<v>.cdx.json (CycloneDX SBOM), release-index.json
# plus one GitHub artifact attestation over all of them, made by this workflow. Tools are never bundled.
#
# release.yml dispatches this workflow when release-please creates a release (a tag made with the default token starts
# no other workflow), with publish true. A manual dispatch on an existing tag is the dry run: it builds and attests,
# and uploads to the release only when `publish` is true, which the publish job allows for release-please tags only.
# PACKAGES_PROXY_TOKEN reaches the build and SBOM jobs only (the ones that download crates), never the publish job.
# Verify an asset with docs/releasing.md.
name: Release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, vX.Y.Z
        required: true
        type: string
      publish:
        description: Upload the assets to the release (false is a dry run)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
            exe: nvmod
          - target: windows
            os: windows-2022
            exe: nvmod.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The tag's source goes to src/; the packaging scripts come from the workflow's own ref in tooling/, so a tag that
      # predates them still builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          persist-credentials: false
      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}

      - name: The tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src/Cargo.toml | head -n1)"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z"; exit 1; }
          [ "v$version" = "$TAG" ] || { echo "Cargo.toml is $version, the tag is $TAG"; exit 1; }
          echo "VERSION=$version" >>"$GITHUB_ENV"

      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Build nvmod
        shell: bash
        working-directory: src
        run: cargo build --release --locked -p nvmod-cli

      - name: Third-party notices
        shell: bash
        run: |
          set -euo pipefail
          (cd src && cargo metadata --locked --format-version 1) >"$RUNNER_TEMP/metadata.json"
          python3 -I tooling/scripts/package_release.py notices --metadata "$RUNNER_TEMP/metadata.json" --out "$RUNNER_TEMP/notices.txt"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tooling/scripts/package_release.py package --target "${{ matrix.target }}" --version "$VERSION" \
            --binary "src/target/release/${{ matrix.exe }}" --notices "$RUNNER_TEMP/notices.txt" --out dist

      # Run the packaged program from a folder of its own, as a user does.
      - name: Smoke test the archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/smoke"
          if [ "${{ matrix.target }}" = windows ]; then
            powershell -NoProfile -Command "Expand-Archive -Path dist/nvmod-$VERSION-x86_64-windows.zip -DestinationPath '$RUNNER_TEMP/smoke'"
            ls "$RUNNER_TEMP/smoke/nvmod-$VERSION-x86_64-windows/nvmod.portable"
          else
            zstd -dc "dist/nvmod-$VERSION-x86_64-linux.tar.zst" | tar -x -C "$RUNNER_TEMP/smoke"
          fi
          "$RUNNER_TEMP/smoke/nvmod-$VERSION-x86_64-${{ matrix.target }}/${{ matrix.exe }}" --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: SBOM
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The tag's source goes to src/; the packaging scripts come from the workflow's own ref in tooling/, so a tag that
      # predates them still builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          persist-credentials: false
      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
      - name: CycloneDX SBOM of the nvmod binary
        working-directory: src
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP" && cargo install cargo-cyclonedx --locked --version 0.5.10)
          cargo cyclonedx --manifest-path crates/nvmod-cli/Cargo.toml --format json --spec-version 1.5 \
            --override-filename sbom
          mkdir ../dist
          mv crates/nvmod-cli/sbom.json "../dist/nvmod-${TAG#v}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-sbom
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Checksums, index, attestation
    needs: [build, sbom]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # upload the assets and add the licence section to the release notes
      id-token: write # the attestation is signed with the workflow's OIDC identity
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Publishing is for release-please tags only
        if: ${{ env.PUBLISH == 'true' }}
        working-directory: src
        run: |
          set -euo pipefail
          # The tag must be a release-please release: vX.Y.Z on main, on the commit of a merged release pull request.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG" refs/remotes/origin/main || { echo "$TAG is not on main"; exit 1; }
          subject="$(git log -1 --format=%s "refs/tags/$TAG")"
          [[ "$subject" =~ ^chore\(main\):\ release\ ${TAG#v}\  ]] || { echo "$TAG is not a release-please commit: $subject"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS and release-index.json
        run: |
          set -euo pipefail
          # The index is built from the archives; SHA256SUMS then covers the archives, the SBOM and the index.
          python3 -I tooling/scripts/package_release.py index --dir dist --tag "$TAG" --repo "$REPO" \
            --date "$(date -u +%F)" --out "$RUNNER_TEMP/release-index.json"
          mv "$RUNNER_TEMP/release-index.json" dist/release-index.json
          python3 -I tooling/scripts/package_release.py sums --dir dist --out "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          ls -l dist
          cat dist/SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to the release
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          notes="$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)"
          if ! grep -q '<!-- release-assets -->' <<<"$notes"; then
            {
              printf '%s\n\n' "$notes"
              cat <<NOTES
          <!-- release-assets -->
          ## Licence and source

          nvmod is GPL-3.0-only (the LICENSE file in each archive). Source of this release: https://github.com/${REPO}/tree/${TAG}

          The binaries are not code-signed yet, so Windows SmartScreen may warn on first run. Verify a download with SHA256SUMS or gh attestation verify; see docs/releasing.md.
          NOTES
            } >"$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ env.PUBLISH != 'true' }}
        with:
          name: release-assets-dry-run
          path: dist/
          retention-days: 7
