# Vulnerability scanning that does not need a pull request to find something:
# The RustSec database against Cargo.lock every day, because a new advisory against an unchanged lockfile is the
# common case. A failed run is the alert. Pull requests are covered by `task deny` in the pipeline. GitHub's
# dependency-review action is not used: it needs GitHub Advanced Security on a private repository.
name: Security

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
      - run: mise exec -- cargo deny check advisories
