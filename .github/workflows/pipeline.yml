# One pipeline ending in "Pipeline Complete", the only required check (estate convention). The checks are steps of
# that one job (GitHub bills each job rounded up to a minute); the two reusable workflows (hygiene, PR title)
# cannot be steps, so they are jobs that the last step gates on. `task check` runs the same checks locally.
name: Pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

# A new commit on a branch cancels the run still going for the older one: runners are limited and the older
# result is of no use. Not cancelled: a title edit (its own group, so it neither cancels nor is cancelled by a
# push; no label events trigger this workflow, so a bot labelling a new pull request starts nothing) and main
# (every commit there runs to the end, so it always has a finished run and its caches are saved).
concurrency:
  group: pipeline-${{ github.ref == 'refs/heads/main' && github.sha || format('{0}-{1}', github.event.pull_request.number || github.ref, github.event.action == 'edited' && github.run_id || 'commits') }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: Hygiene
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3
    with:
      package-proxy-guard: enforce
    secrets:
      PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}

  pr-title:
    name: PR title
    if: ${{ github.event_name == 'pull_request' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/pr-title-check.yml@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3

  quarantine:
    name: Quarantine
    uses: JorisJonkers-dev/github-workflows/.github/workflows/quarantine-check.yml@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3

  # nvmod's crates ship inside the Toolbox on Linux, Windows and macOS (Toolbox ADR-0006), so they build and test
  # natively on all three. Linux runs in Pipeline Complete itself.
  platforms:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -A clippy::disallowed-methods
      - name: Test
        if: ${{ !cancelled() }}
        # Every failing test in one run, not only those of the first crate that fails.
        run: cargo test --locked --workspace --no-fail-fast

  pipeline-complete:
    name: Pipeline Complete
    needs: [hygiene, pr-title, quarantine, platforms]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Documentation-only changes and changes under gui/ (its own workflow, gui.yml, builds it) skip the Rust steps. Every other check, and the gate below, still runs.
      - name: Changed files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >>"$GITHUB_OUTPUT"; echo "no base to compare with: building"; exit 0
          fi
          if git diff --name-only "$BASE...$HEAD" | grep -qvE '^(docs/|gui/|LICENSE$|.*\.md$)'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"; echo "only documentation changed: the Rust steps are skipped"
          fi

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          cache: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ steps.changes.outputs.code == 'true' }}
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Separate steps so one failing check does not hide the others.
      - name: Format
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: mise exec -- task fmt
      - name: Clippy
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: mise exec -- task clippy
      - name: Tests and coverage gate
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: mise exec -- task test
      - name: Fuzz harnesses compile
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: mise exec -- task fuzz:check
      - name: Dependencies
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: mise exec -- task deny
      - name: Advisories (cargo audit)
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: mise exec -- task audit
      - name: MSRV
        if: ${{ !cancelled() }}
        run: mise exec -- task msrv
      - name: Secrets
        if: ${{ !cancelled() }}
        run: mise exec -- task secrets
      - name: Workflows
        if: ${{ !cancelled() }}
        run: mise exec -- task lint:actions
      - name: Repository guards
        if: ${{ !cancelled() }}
        run: mise exec -- task guards
      - name: Guard self-tests
        if: ${{ !cancelled() }}
        run: mise exec -- task scripts

      # A job that did not succeed fails the gate, except the two that only run on pull requests.
      - name: Reusable-workflow jobs passed
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | select(.value.result != "skipped" or (.key | IN("hygiene", "pr-title") | not)) | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then echo "$failed"; exit 1; fi
