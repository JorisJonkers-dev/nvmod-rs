# release-please keeps a release pull request open; merging it tags vX.Y.Z, writes CHANGELOG.md and bumps the
# version in Cargo.toml (release-please-config.json) and the lock files (the step below). Nothing goes to crates.io or a
# registry. When a release is created, release-assets.yml builds the CLI archives and attaches them (ADR-0009).
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with the personal-stack-agents App token (not the
      # default GITHUB_TOKEN) so CI runs on the PR without a manual approval
      # gate. Best-effort: falls back to GITHUB_TOKEN when the App secrets or
      # installation are absent.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        continue-on-error: true
        with:
          permission-contents: write
          permission-pull-requests: write
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please cannot edit Cargo.lock: its JSONPath filters match nothing in an array of tables. Without
      # the lock bump the release PR fails every `--locked` build. So refresh the workspace members' own entries
      # on the release branch, with the App token so that CI runs on the new commit.
      - if: ${{ steps.rp.outputs.pr != '' && steps.rp.outputs.pr != 'null' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
          persist-credentials: false
      - if: ${{ steps.rp.outputs.pr != '' && steps.rp.outputs.pr != 'null' }}
        name: Refresh the lock entries of the workspace crates
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          cargo update --workspace
          cargo update --workspace --manifest-path fuzz/Cargo.toml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): refresh the workspace lock entries"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

  # A tag created with the default token starts no workflow of its own, so the asset build is dispatched from here
  # (a dispatch made with the default token does start a run).
  release-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the asset build for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run release-assets.yml --repo "$REPO" --ref "$TAG" -f tag="$TAG" -f publish=true

  # The Toolbox follows this Component's releases with a self-hosted Renovate (its components.yml). GitHub delays its
  # schedule by hours, so a release tells the Toolbox at once; the payload is not read.
  toolbox:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rauls-trusty-toolbox
          permission-contents: write
      - name: Tell the Toolbox
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/JorisJonkers-dev/rauls-trusty-toolbox/dispatches \
            -f event_type=component-release -f 'client_payload[component]=nvmod' -f "client_payload[tag]=$TAG"
