# A pull request that changes how the release packages are made builds the Linux archive and prints what a release
# would push as an OCI package, and builds and runs the macOS archive, without logging in to a registry and without
# any write permission. A broken package is found here, before a release.
name: Packages dry run

on:
  pull_request:
    paths:
      - .github/workflows/release-assets.yml
      - .github/workflows/packages-dry-run.yml
      - scripts/package_release.py
  # On main the same files' changes run it too, so the macOS builds' rust-cache is saved there for pull requests.
  push:
    branches: [main]
    paths:
      - .github/workflows/release-assets.yml
      - .github/workflows/packages-dry-run.yml
      - scripts/package_release.py

permissions:
  contents: read

concurrency:
  group: packages-dry-run-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  packages-dry-run:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build nvmod
        run: cargo build --release --locked -p nvmod-cli
      - name: Create the Linux archive
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          cargo metadata --locked --format-version 1 >"$RUNNER_TEMP/metadata.json"
          python3 -I scripts/package_release.py notices --metadata "$RUNNER_TEMP/metadata.json" --out "$RUNNER_TEMP/notices.txt"
          python3 -I scripts/package_release.py package --target linux --version "$VERSION" \
            --binary target/release/nvmod --notices "$RUNNER_TEMP/notices.txt" --out packages
          zstd -t "packages/nvmod-$VERSION-x86_64-linux.tar.zst"
      - name: Print what would be pushed
        run: |
          set -euo pipefail
          archive="packages/nvmod-$VERSION-x86_64-linux.tar.zst"
          echo "Would push: ghcr.io/jorisjonkers-dev/nvmod-rs:${VERSION}-x86_64-linux"
          echo "Archive SHA-256: $(sha256sum "$archive" | awk '{print $1}')"

  # The macOS release archive as release-assets.yml builds it: arm64 and x86_64 on two runners in parallel (x86_64
  # cross-compiled on Apple silicon), each with its own rust-cache (saved on main, as the pipeline's), then joined with
  # lipo, packaged, and the packaged program run from a folder of its own.
  macos-half:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        rust-target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.rust-target }}
          shared-key: macos-${{ matrix.rust-target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build nvmod
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          set -euo pipefail
          rustup target add "$RUST_TARGET"
          cargo build --release --locked -p nvmod-cli --target "$RUST_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nvmod-macos-${{ matrix.rust-target }}
          path: target/${{ matrix.rust-target }}/release/nvmod
          if-no-files-found: error
          retention-days: 3

  macos-archive:
    needs: macos-half
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nvmod-macos-*
          path: ${{ runner.temp }}/halves
      - name: Join the halves
        run: |
          set -euo pipefail
          mkdir -p target/release
          lipo -create -output target/release/nvmod \
            "$RUNNER_TEMP/halves/nvmod-macos-aarch64-apple-darwin/nvmod" "$RUNNER_TEMP/halves/nvmod-macos-x86_64-apple-darwin/nvmod"
          chmod 0755 target/release/nvmod
          lipo -archs target/release/nvmod | tee "$RUNNER_TEMP/archs"
          grep -qw arm64 "$RUNNER_TEMP/archs" && grep -qw x86_64 "$RUNNER_TEMP/archs"
      - name: Create and run the macOS archive
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          cargo metadata --locked --format-version 1 >"$RUNNER_TEMP/metadata.json"
          python3 -I scripts/package_release.py notices --metadata "$RUNNER_TEMP/metadata.json" --out "$RUNNER_TEMP/notices.txt"
          python3 -I scripts/package_release.py package --target macos --version "$VERSION" \
            --binary target/release/nvmod --notices "$RUNNER_TEMP/notices.txt" --out packages
          mkdir "$RUNNER_TEMP/smoke"
          zstd -dc "packages/nvmod-$VERSION-universal-macos.tar.zst" | tar -x -C "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/nvmod-$VERSION-universal-macos/nvmod" --version
