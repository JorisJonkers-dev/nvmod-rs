# A pull request that changes how the release packages are made builds the Linux archive and prints what a release
# would push as an OCI package, without logging in to a registry and without any write permission. A broken
# package is found here, before a release.
name: Packages dry run

on:
  pull_request:
    paths:
      - .github/workflows/release-assets.yml
      - .github/workflows/packages-dry-run.yml
      - scripts/package_release.py

permissions:
  contents: read

concurrency:
  group: packages-dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  packages-dry-run:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build nvmod
        run: cargo build --release --locked -p nvmod-cli
      - name: Create the Linux archive
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          cargo metadata --locked --format-version 1 >"$RUNNER_TEMP/metadata.json"
          python3 -I scripts/package_release.py notices --metadata "$RUNNER_TEMP/metadata.json" --out "$RUNNER_TEMP/notices.txt"
          python3 -I scripts/package_release.py package --target linux --version "$VERSION" \
            --binary target/release/nvmod --notices "$RUNNER_TEMP/notices.txt" --out packages
          zstd -t "packages/nvmod-$VERSION-x86_64-linux.tar.zst"
      - name: Print what would be pushed
        run: |
          set -euo pipefail
          archive="packages/nvmod-$VERSION-x86_64-linux.tar.zst"
          echo "Would push: ghcr.io/jorisjonkers-dev/nvmod-rs:${VERSION}-x86_64-linux"
          echo "Archive SHA-256: $(sha256sum "$archive" | awk '{print $1}')"
